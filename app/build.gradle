plugins { id 'com.android.application' }

android {
    namespace 'com.jarvis.homemultitool'
    compileSdk 35
    signingConfigs {
        jarvisRelease {
            storeFile file('../jarvis-release.jks')
            storePassword 'jarvis-release-2026'
            keyAlias 'jarvis'
            keyPassword 'jarvis-release-2026'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId 'com.jarvis.homemultitool'
        minSdk 26
        targetSdk 35
        versionCode 50
        versionName '5.49.0-max-ai-assistant'
    }
    buildTypes {
        release {
            signingConfig signingConfigs.jarvisRelease
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.jarvisRelease
        }
    }
}
