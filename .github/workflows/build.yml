name: JARVIS 5.40.0 Professional AI Release
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release APK
        run: gradle --no-daemon --stacktrace clean :app:assembleRelease
      - name: Verify release artifact
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          file app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          test ! -n "$(grep -R 'keySet()' app/src/main/java || true)"
          test -f app/src/main/java/com/jarvis/homemultitool/JarvisLocalAI.java
          echo 'Release APK verified'
          echo 'JARVIS 5.40.0 professional AI release verified'
          unzip -l app/build/outputs/apk/release/app-release.apk | grep -E 'JarvisVoiceInteractionService|JarvisVoiceSession' || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-release
          path: app/build/outputs/apk/release/*.apk
