name: JARVIS 5.31 Assistant Release
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify release artifact
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          file app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          echo 'Release APK verified'
          echo 'JARVIS 5.31.0 ready for in-place update'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-release
          path: app/build/outputs/apk/release/*.apk
