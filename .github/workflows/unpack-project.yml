name: Unpack JARVIS Android Project

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/*.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find project archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find input -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$archive" ]; then
            echo "No ZIP archive found in input/"
            exit 1
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "Using: $archive"

      - name: Unpack project into repository root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .unpack
          mkdir -p .unpack
          unzip -q "${{ steps.archive.outputs.archive }}" -d .unpack

          # If the ZIP contains one wrapper directory, use its contents.
          shopt -s dotglob nullglob
          entries=(.unpack/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            source_dir="${entries[0]}"
          else
            source_dir=".unpack"
          fi

          # Preserve this workflow and repository metadata while copying the project.
          rsync -a --exclude '.git/' --exclude '.github/workflows/unpack-project.yml' "$source_dir"/ ./

          rm -rf .unpack
          rm -rf input

          # The ZIP is the source artifact; after extraction the repository itself is the project.
          echo "Repository project structure:"
          find . -maxdepth 3 -type f | sort | head -200

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle || test -f settings.gradle.kts || { echo 'Missing settings.gradle(.kts)'; exit 1; }
          test -f build.gradle || test -f build.gradle.kts || { echo 'Missing build.gradle(.kts)'; exit 1; }
          test -d app || { echo 'Missing app module'; exit 1; }
          test -f app/build.gradle || test -f app/build.gradle.kts || { echo 'Missing app/build.gradle(.kts)'; exit 1; }
          echo 'Android project structure looks valid.'

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
          else
            git commit -m "Unpack JARVIS Android project"
            git push
          fi
